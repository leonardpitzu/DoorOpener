configuration:
  entity_id:
    name: Door entity
    description: >-
      The switch, lock, input_boolean or button that opens the door, for
      example button.intercom_open.
  battery_entity:
    name: Battery sensor (optional)
    description: >-
      A sensor with the opener's battery level in %, shown on the keypad. Leave
      empty if it has none.
  settings:
    name: DoorOpener settings
    description: >-
      How the keypad is served, the admin panel on its port, and the
      brute-force limits.
    fields:
      ssl:
        name: HTTPS
        description: >-
          Serve the keypad over HTTPS with a certificate from Home Assistant's
          /ssl folder (the Let's Encrypt or DuckDNS app puts one there).
          Renewed certificates are picked up by themselves. Leave off behind a
          reverse proxy that does HTTPS, or for plain HTTP at home.
      certfile:
        name: Certificate file (file name in /ssl)
        description: The certificate with its full chain. Default fullchain.pem.
      keyfile:
        name: Private key file (file name in /ssl)
        description: The certificate's private key. Default privkey.pem.
      trusted_proxies:
        name: Reverse proxies in front
        description: >-
          0 when browsers connect to the keypad port directly. 1 behind one
          reverse proxy or tunnel (NGINX Proxy Manager, a Cloudflare tunnel,
          Caddy, ...), so the brute-force limits see each visitor's address.
          Only a proxy on your own network is believed.
      admin_password:
        name: Admin password on the keypad port (optional)
        description: >-
          Leave empty to keep the admin panel inside Home Assistant only (Open
          Web UI, or Show in sidebar). Set one to also reach it from the
          keypad's gear icon.
      max_attempts:
        name: Wrong PINs per device
        description: Wrong PINs from one IP address before it is blocked.
      session_max_attempts:
        name: Wrong PINs per browser
        description: >-
          Wrong PINs from one browser before it is blocked. Also the wrong admin
          passwords allowed per IP address.
      block_time_minutes:
        name: First block (minutes)
        description: >-
          How long the first block lasts. Each further block doubles, up to 24
          hours; a correct PIN resets it.
      max_global_attempts_per_hour:
        name: Alert threshold per hour
        description: >-
          Wrong PINs per hour, from everyone together, that send a brute-force
          alert to Home Assistant (notification dooropener_alert). Never locks
          anyone out.
      test_mode:
        name: Test mode
        description: Go through the motions without opening the door.
network:
  6532/tcp: Keypad port
