name: DoorOpener
version: "2.9.0"
slug: dooropener
description: >-
  A PIN keypad that opens your door through Home Assistant: per-user and guest
  PINs, brute-force protection with alerts, HTTPS, and an admin panel inside
  Home Assistant. Works with switch, lock, input_boolean and button entities.
url: https://github.com/leonardpitzu/DoorOpener
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
# The admin panel inside Home Assistant (Open Web UI, or the sidebar entry the
# user can switch on), behind its login. Ingress reaches the app on its internal
# port 8099, which is not published on the host.
ingress: true
ingress_port: 8099
panel_icon: mdi:door
panel_title: DoorOpener
panel_admin: true
# [PROTO:ssl] is https while the ssl option is on, http otherwise.
watchdog: "[PROTO:ssl]://[HOST]:[PORT:6532]/health"
homeassistant_api: true
ports:
  6532/tcp: 6532
ports_description:
  6532/tcp: Keypad
map:
  - config:rw
  # Certificates shared by Home Assistant apps, for the ssl option.
  - ssl:ro
# The app always talks to Home Assistant through the Supervisor, on port 6532
# inside the container (the host port is in the Network section), and keeps its
# session key in /data: ha_url, ha_token, ha_cert_pem, port and secret_key exist
# only in a standalone container's options.json. Names and descriptions shown in
# the configuration page are in translations/en.yaml.
options:
  entity_id: "switch.dooropener"
  ssl: false
  test_mode: false
  max_attempts: 5
  session_max_attempts: 3
  block_time_minutes: 5
  max_global_attempts_per_hour: 50
schema:
  entity_id: "match(^(switch|lock|input_boolean|button)\\.[a-z0-9_]+$)"
  ssl: bool
  test_mode: bool
  max_attempts: "int(1,100)"
  session_max_attempts: "int(1,50)"
  block_time_minutes: "int(1,60)"
  max_global_attempts_per_hour: "int(1,1000)"
  # Optional: hidden behind "Show unused optional configuration options" until set.
  battery_entity: "match(^(sensor\\.[a-z0-9_]+)?$)?"
  admin_password: password?
  certfile: str?
  keyfile: str?
  trusted_proxies: "int(0,5)?"
