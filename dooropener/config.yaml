name: DoorOpener
version: "3.1.0"
slug: dooropener
description: >-
  A PIN keypad that opens your doors through Home Assistant: a door, a barrier,
  a gate. Each user gets their doors and hours, guests switch themselves off,
  and there is brute-force protection with alerts, HTTPS, and an admin panel
  inside Home Assistant.
url: https://github.com/leonardpitzu/DoorOpener
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
# The admin panel inside Home Assistant (Open Web UI, or the sidebar entry the
# user can switch on), behind its login. Ingress reaches the app on its internal
# port 8099, which is not published on the host.
ingress: true
ingress_port: 8099
panel_icon: mdi:door
panel_title: DoorOpener
panel_admin: true
# The health check goes to the ingress listener: plain HTTP with or without the
# HTTPS setting (the Supervisor reads [PROTO:...] only from top-level options,
# and HTTPS lives in the settings section), in the same process as the keypad,
# and reachable only from the Supervisor.
watchdog: "http://[HOST]:[PORT:8099]/health"
homeassistant_api: true
ports:
  6532/tcp: 6532
ports_description:
  6532/tcp: Keypad
map:
  - config:rw
  # Certificates shared by Home Assistant apps, for the HTTPS setting.
  - ssl:ro
# The app always talks to Home Assistant through the Supervisor, on port 6532
# inside the container (the host port is in the Network section), and keeps its
# session key in /data: ha_url, ha_token, ha_cert_pem, port and secret_key exist
# only in a standalone container's options.json. The configuration page shows
# the doors first, as a list, then DoorOpener's own settings as a section; names
# and descriptions are in translations/en.yaml.
options:
  doors: []
  settings:
    ssl: false
    certfile: fullchain.pem
    keyfile: privkey.pem
    trusted_proxies: 0
    report_to_ha: true
    max_attempts: 5
    session_max_attempts: 3
    block_time_minutes: 5
    max_global_attempts_per_hour: 50
    test_mode: false
schema:
  # config.py checks the rest: ids unique and not one of the keypad's own paths.
  doors:
    - name: str
      id: "match(^[a-z0-9][a-z0-9_-]{0,23}$)"
      entity_id: "match(^(switch|lock|input_boolean|button|cover|script)\\.[a-z0-9_]+$)"
      battery_entity: "match(^(sensor\\.[a-z0-9_]+)?$)?"
      icon: "list(door|barrier|gate|garage)?"
  settings:
    ssl: bool
    certfile: str?
    keyfile: str?
    trusted_proxies: "int(0,5)"
    admin_password: password?
    report_to_ha: bool
    max_attempts: "int(1,100)"
    session_max_attempts: "int(1,50)"
    block_time_minutes: "int(1,60)"
    max_global_attempts_per_hour: "int(1,1000)"
    test_mode: bool
