name: DoorOpener
version: "2.8.0"
slug: dooropener
description: >-
  A secure web interface for controlling smart door openers via Home Assistant.
  Features a visual PIN keypad, per-user PINs, battery monitoring, and
  brute-force protection. Supports switch, lock, input_boolean, and button entities.
url: https://github.com/leonardpitzu/DoorOpener
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
# The admin panel in Home Assistant's sidebar, behind its login. Ingress reaches
# the app on its internal port 8099, which is not published on the host.
ingress: true
ingress_port: 8099
panel_icon: mdi:door
panel_title: DoorOpener
panel_admin: true
# [PROTO:ssl] is https while the ssl option is on, http otherwise.
webui: "[PROTO:ssl]://[HOST]:[PORT:6532]"
watchdog: "[PROTO:ssl]://[HOST]:[PORT:6532]/health"
homeassistant_api: true
ports:
  6532/tcp: 6532
ports_description:
  6532/tcp: DoorOpener web interface
map:
  - config:rw
  # Certificates shared by Home Assistant apps, for the ssl option.
  - ssl:ro
options:
  ha_url: "http://supervisor/core"
  ha_token: ""
  entity_id: "switch.dooropener"
  battery_entity: ""
  port: 6532
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  test_mode: false
  admin_password: ""
  max_attempts: 5
  block_time_minutes: 5
  max_global_attempts_per_hour: 50
  session_max_attempts: 3
  secret_key: ""
  session_cookie_secure: false
  trusted_proxies: 0
  ha_cert_pem: ""
schema:
  ha_url: url
  ha_token: str
  entity_id: str
  battery_entity: str?
  port: port
  ssl: bool
  certfile: str
  keyfile: str
  test_mode: bool
  admin_password: password?
  max_attempts: "int(1,100)"
  block_time_minutes: "int(1,60)"
  max_global_attempts_per_hour: "int(1,1000)"
  session_max_attempts: "int(1,50)"
  secret_key: str?
  session_cookie_secure: bool
  trusted_proxies: "int(0,5)"
  ha_cert_pem: str?
