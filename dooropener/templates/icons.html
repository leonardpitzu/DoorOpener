{#- Door icons, drawn in the text colour. The names are config.DOOR_ICONS. -#}
{% macro icon(name) -%}
<svg class="door-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "barrier" -%}
<path d="M2 21.5h7"/><rect x="3.5" y="9.5" width="3.5" height="12" rx="0.8"/><path d="M7 12h14.5v3.5H7z"/><path d="M10.5 12 9 15.5M14.5 12 13 15.5M18.5 12 17 15.5"/>
{%- elif name == "gate" -%}
<path d="M2.5 21.5h19M4 21.5V4.5M20 21.5V4.5M4 8h16M4 17.5h16M8 8v9.5M12 8v9.5M16 8v9.5"/>
{%- elif name == "garage" -%}
<path d="M3 21.5V9.5l9-6 9 6v12"/><path d="M7 21.5v-9h10v9M7 15.5h10M7 18.5h10"/>
{%- else -%}
<path d="M3 21.5h18"/><rect x="5.5" y="2.5" width="13" height="19" rx="1.2"/><circle cx="15" cy="12.5" r="1" fill="currentColor"/>
{%- endif -%}
</svg>
{%- endmacro %}
