name: CI

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", ".gitignore", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", ".gitignore", "LICENSE"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff==0.15.1
      - name: Check for errors
        run: ruff check dooropener/ tests/

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest tests/ -v --cov=dooropener --cov-report=term-missing --cov-fail-under=75

  security:
    name: Security (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install bandit
      - name: Security scan
        run: bandit -q -r dooropener/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -f Dockerfile.dev -t dooropener:ci .

  app:
    name: App image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [tests]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Nothing is published: the Supervisor builds this on the Home Assistant
      # host from config.yaml's version. Dockerfile.dev above is a different
      # image, so without this the app's own Dockerfile has no CI coverage.
      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: dooropener
          push: false
          load: true
          tags: dooropener-app:ci
          build-args: |
            BUILD_VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
